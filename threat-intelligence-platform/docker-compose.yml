version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - tip-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - tip-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: threat_intel
      MYSQL_USER: tipuser
      MYSQL_PASSWORD: tippassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tip-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  ingestion-service:
    build: ./ingestion-service
    container_name: ingestion-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - EXTRACTION_SERVICE_URL=http://extraction-service:3002
    depends_on:
      - extraction-service
    networks:
      - tip-network
    restart: on-failure

  extraction-service:
    build: ./extraction-service
    container_name: extraction-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - PRODUCER_SERVICE_URL=http://producer-service:3003
    depends_on:
      - producer-service
    networks:
      - tip-network
    restart: on-failure

  producer-service:
    build: ./producer-service
    container_name: producer-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=ioc-topic
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - tip-network
    restart: on-failure

  consumer-service:
    build: ./consumer-service
    container_name: consumer-service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=ioc-topic
      - KAFKA_GROUP_ID=ioc-consumer-group
      - RANKING_SERVICE_URL=http://ranking-service:3005
    depends_on:
      kafka:
        condition: service_healthy
      ranking-service:
        condition: service_started
    networks:
      - tip-network
    restart: on-failure

  ranking-service:
    build: ./ranking-service
    container_name: ranking-service
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - DATABASE_SERVICE_URL=http://database-service:3006
    depends_on:
      - database-service
    networks:
      - tip-network
    restart: on-failure

  database-service:
    build: ./database-service
    container_name: database-service
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=tipuser
      - DB_PASSWORD=tippassword
      - DB_NAME=threat_intel
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tip-network
    restart: on-failure

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_SERVICE_URL=http://database-service:3006
    depends_on:
      - database-service
    networks:
      - tip-network
    restart: on-failure

networks:
  tip-network:
    driver: bridge

volumes:
  mysql-data:
